name: Build and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore sample/HeruConsoleApp/HeruConsoleApp.csproj

      - name: Build
        run: dotnet build sample/HeruConsoleApp/HeruConsoleApp.csproj --configuration Release

      - name: Test (optional)
        if: github.event_name == 'pull_request'
        run: dotnet test sample/HeruConsoleApp/HeruConsoleApp.csproj --configuration Release

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./sample/HeruConsoleApp
          push: true
          tags: |
            your-docker-repo/heru-console:latest
            your-docker-repo/heru-console:${{ github.sha }}
